name: E2E

# Optional container variant. Compare its complete job time with a runner-based job.

on:
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Match this tag exactly to the project's @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
