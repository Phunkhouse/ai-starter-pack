name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Links
        run: |
          python3 scripts/test-check-links.py
          python3 scripts/check-links.py

      - name: Production parity
        run: |
          python3 scripts/check-production-parity.py --self-test
          python3 scripts/check-production-parity.py

      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Workflows (pack and recipes)
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          git ls-files -z '.github/workflows/*.yml' 'recipes/**/*.yml' |
            xargs -0 ./actionlint -color
